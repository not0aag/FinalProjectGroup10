name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build and start
        run: |
          docker build -t flask-app:staging .
          docker run -d -p 5000:5000 --name flask-staging-test --env APP_ENV=staging flask-app:staging
          sleep 10
      
      - name: Test
        run: |
          curl -f http://localhost:5000/ || exit 1
          HEALTH=$(curl -s http://localhost:5000/health)
          if [[ "$HEALTH" != *"staging"* ]] || [[ "$HEALTH" != *"healthy"* ]]; then
            exit 1
          fi
      
      - name: Cleanup
        if: always()
        run: |
          docker stop flask-staging-test || true
          docker rm flask-staging-test || true
