name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build and tag
        run: |
          docker build -t flask-app:production .
          docker tag flask-app:production flask-app:${{ github.sha }}
          docker tag flask-app:production flask-app:latest
      
      - name: Start container
        run: |
          docker run -d -p 8000:5000 --name flask-production-test --env APP_ENV=production flask-app:production
          sleep 10
      
      - name: Test endpoints
        run: |
          curl -f http://localhost:8000/ || exit 1
          HEALTH=$(curl -s http://localhost:8000/health)
          if [[ "$HEALTH" != *"production"* ]] || [[ "$HEALTH" != *"healthy"* ]]; then
            exit 1
          fi
      
      - name: Cleanup
        if: always()
        run: |
          docker stop flask-production-test || true
          docker rm flask-production-test || true
